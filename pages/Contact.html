<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us - RAMACOL</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">  

</head>
<body>

<header>
    <h1>Contact RAMACOL</h1>
    <nav>
        <a href="../index.html">Home</a>
        <a href="About us.html">About Us</a>
        <a href="Our service.html">Our Services</a>
        <a href="Contact.html" class="active">Contact Us</a>
        <a href="Gallery.html">Gallery</a>
        <a href="enquiry.html">Enquiry</a>
    </nav>
</header>

<main>


    <!-- Contact Information -->
    <section>
        <h2>Get in Touch</h2>
        <p><strong>Phone:</strong> 0647049498</p>
        <p><strong>Email:</strong> 
            <a href="mailto:awelanicolleen@gmail.com">
                awelanicolleen@gmail.com
            </a>
        </p>
    </section>

    <!-- Contact Form -->
    <section>
        <h2>LET US KNOW YOU</h2>

        <form id="contactForm" action="https://formsubmit.co/awelanicolleen@gmail.com" method="POST">

            <!-- Hidden FormSubmit settings -->
            <input type="hidden" name="_subject" value="New Contact Form Submission">
            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" name="_template" value="table">

            <label class="form-label">First Name</label>
            <input type="text" name="FirstName" id="FirstName" class="form-input">

            <label class="form-label">Last Name</label>
            <input type="text" name="LastName" id="LastName" class="form-input">

            <label class="form-label">Email Address</label>
            <input type="email" name="Email" id="Email" class="form-input">

            <label class="form-label">Contact Number</label>
            <input type="text" name="contact" id="contact" class="form-input">

            <input type="submit" value="Submit" class="submit-btn">

        </form>

        <p id="formMessage"></p>
    </section>

</main>

<footer id="footer">
    <p>&copy;<span id="currentYear"></span> RAMACOL Reproductive Health Center. All Rights Reserved</p>
</footer>


<!-- JavaScript Validation -->
<script>
    // Update year
    document.getElementById("currentYear").textContent = new Date().getFullYear();

    // Form Validation
    document.getElementById("contactForm").addEventListener("submit", function(event) {
        const firstName = document.getElementById("FirstName").value.trim();
        const lastName = document.getElementById("LastName").value.trim();
        const email = document.getElementById("Email").value.trim();
        const contact = document.getElementById("contact").value.trim();
        const message = document.getElementById("formMessage");

        // Required fields
        if (firstName === "" || lastName === "" || email === "" || contact === "") {
            event.preventDefault();
            message.style.color = "red";
            message.textContent = "⚠️ Please fill out all fields.";
            return;
        }

        // Email check
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email)) {
            event.preventDefault();
            message.style.color = "red";
            message.textContent = "⚠️ Please enter a valid email address.";
            return;
        }

        // Success message (FormSubmit will still send email)
        message.style.color = "green";
        message.textContent = "✅ Sending your message...";
    });
</script>

</body>
</html>
