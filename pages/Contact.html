<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Womens Health Treatment">
    <meta name="keywords" content="women health, family planning,hiv testing">
    <meta name="author" content="your name">

    <title>Contact Us - RAMACOL</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .form-label { font-weight: 600; }
        .form-input { padding: 10px; border-radius: 6px; border: 1px solid #ccc; width: 100%; margin-bottom: 10px; }
        .submit-btn { background: #006699; color: white; padding: 12px; border: none; border-radius: 6px; cursor: pointer; }
        #formMessage { font-weight: 600; margin-top: 10px; }
    </style>
</head>
<body>
    <header id="contact-header" class="header">
        <h1 id="header-title">Contact RAMACOL</h1>
        <nav id="navbar" class="navbar">
            <a href="../index.html" class="nav-link">Home</a>
            <a href="About us.html" class="nav-link">About Us</a>
            <a href="Our service.html" class="nav-link">Our Services</a>
            <a href="Contact.html" class="nav-link active">Contact Us</a>
            <a href="Gallery.html" class="nav-link">Gallery</a>
            <a href="enquiry.html" class="nav-link">Enquiry</a>
        </nav>
    </header>

    <main id="main-content">
        <!-- Contact Information Section -->
        <section id="contact-info">
            <h2 id="contact-title">Get in Touch</h2>
            <p><strong>Phone:</strong> 0647049498</p>
            <p><strong>Email:</strong> <a href="mailto:awelanicollen@gmail.com" class="email-link">awelanicollen@gmail.com</a></p>
        </section>

        <!-- Contact Form Section -->
        <section id="contact-form-section">
            <h2>LET US KNOW YOU</h2>
            <form id="contactForm">
                <label for="FirstName" class="form-label">First Name</label>
                <input name="FirstName" type="text" id="FirstName" class="form-input">

                <label for="LastName" class="form-label">Last Name</label>
                <input name="LastName" type="text" id="LastName" class="form-input">

                <label for="Email" class="form-label">Email Address</label>
                <input name="Email" type="email" id="Email" class="form-input">

                <label for="contact" class="form-label">Contact Number</label>
                <input name="contact" type="text" id="contact" class="form-input">

                <input type="submit" value="Submit" class="submit-btn">
            </form>
            <p id="formMessage"></p>
        </section>

        <!-- Location Section -->
        <section id="location">
            <h2 id="location-title">Our Location</h2>
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3673.160666921176!2d30.45443597602965!3d-22.981118640533186!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x1ec5c7341ebeeabf%3A0x831549c35048874e!2sMedi%2024%20Clinic%20and%20Hospital!5e0!3m2!1sen!2sie!4v1756110559239!5m2!1sen!2sie" 
                width="600" 
                height="450" 
                style="border:0;" 
                allowfullscreen="" 
                loading="lazy" 
                referrerpolicy="no-referrer-when-downgrade" 
                class="google-map">
            </iframe>
        </section>

        <!-- Working Hours Section -->
        <section id="working-hours">
            <h2>Working Hours</h2>
            <ul class="working-hours-list">
                <li>Monday - Friday: 08:00 AM - 05:00 PM</li>
            </ul>
        </section>
    </main>

    <footer id="footer" class="footer">
        <p>&copy;<span id="currentYear"></span> RAMACOL Reproductive Health Center. All Rights Reserved</p>
    </footer>

    <script>
        // Set current year
        document.getElementById("currentYear").textContent = new Date().getFullYear();

        document.getElementById("contactForm").addEventListener("submit", function(event) {
            event.preventDefault(); // Stop form from reloading page

            const firstName = document.getElementById("FirstName").value.trim();
            const lastName = document.getElementById("LastName").value.trim();
            const email = document.getElementById("Email").value.trim();
            const contact = document.getElementById("contact").value.trim();
            const message = document.getElementById("formMessage");

            // Basic validation
            if (firstName === "" || lastName === "" || email === "" || contact === "") {
                message.style.color = "red";
                message.textContent = "⚠️ Please fill out all fields.";
                return;
            }

            // Email format validation
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                message.style.color = "red";
                message.textContent = " enter a valid email address.";
                return;
            }

            // Success message
            message.style.color = "green";
            message.textContent = `✅ Thank you, ${firstName}! Your form has been received.`;

            // Clear form fields
            document.getElementById("contactForm").reset();
        });
    </script>
</body>
</html>
